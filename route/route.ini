[routes]

;==============================================================================
; Public / Authentication Routes
;==============================================================================
GET /=DashboardController->index
GET /login=AuthController->showLogin
POST /login=AuthController->login
POST /logout=AuthController->logout
GET /logout=AuthController->logout

;==============================================================================
; Protected Dashboard & Multi-Database Routes
;==============================================================================
GET /dashboard=DashboardController->index
GET /databases=DashboardController->databases

;==============================================================================
; REST API Endpoints (sys-api) - Untuk Mobile App / AJAX / Pihak Ketiga
;==============================================================================
GET /api/transactions/summary=TransactionApi->apiSummary

;-- Modul Customer --
GET /customer=CustomerController->index
POST /customer/create=CustomerController->store
GET /api/customer=CustomerApi->apiList
