[globals]
; Folder yang di-autoload oleh engine (Controller Web, API, Middleware, Library, Helper)
AUTOLOAD=sys-controller/|sys-api/|middleware/|lib/|helper/

; Level debug (0 = Production/Masking Error, 1-3 = Development)
DEBUG=2

; Lokasi folder view/template
UI=sys-view/

; Lokasi folder upload
UPLOADS=uploads/

; Nama aplikasi
site="X-Native Enterprise Web"
API_HOST=http://localhost/groblive/x-native/
